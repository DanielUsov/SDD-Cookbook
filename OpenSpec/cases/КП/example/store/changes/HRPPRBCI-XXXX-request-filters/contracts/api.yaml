openapi: 3.0.3
info:
  title: Requests API (фрагмент фичи HRPPRBCI-XXXX)
  version: fragment
x-removed: []
paths:
  /requests:
    get:
      summary: Список заявок с фильтрами
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Один или несколько статусов, объединяются по «или»
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RequestStatus'
        - name: createdFrom
          in: query
          required: false
          description: Нижняя граница даты создания, включительно
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          required: false
          description: Верхняя граница даты создания, включительно
          schema:
            type: string
            format: date
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_PERIOD, INVALID_STATUS, INVALID_PAGE]
        message:
          type: string

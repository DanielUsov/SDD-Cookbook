openapi: 3.0.3
info:
  title: Requests API
  version: 2.3.0
paths:
  /requests:
    get:
      summary: Список заявок
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '400':
          description: Некорректные параметры
components:
  schemas:
    RequestStatus:
      type: string
      enum: [NEW, IN_PROGRESS, DONE, REJECTED]
    Request:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        assigneeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    RequestPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Request'
        hasNext:
          type: boolean
